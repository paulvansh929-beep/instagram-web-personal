<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Instagram profile website" />
  <title>@yourhandle &middot; Instagram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <div class="topbar__inner">
      <span class="topbar__logo">Instagram</span>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle theme" title="Toggle theme">🌙</button>
    </div>
  </header>

  <main class="container">
    <!-- ===== Profile header ===== -->
    <section class="profile">
      <div class="profile__avatar">
        <img
          src="https://picsum.photos/seed/instagramprofile/300/300"
          alt="Profile photo"
          id="avatarImg"
        />
      </div>

      <div class="profile__info">
        <div class="profile__row">
          <h1 class="profile__username" id="profileUsername">yourhandle</h1>
          <a class="btn btn--primary" id="followBtn"
             href="https://instagram.com/yourhandle" target="_blank" rel="noopener">Follow</a>
          <a class="btn btn--ghost" href="https://instagram.com/yourhandle"
             target="_blank" rel="noopener">Message</a>
        </div>

        <ul class="profile__stats">
          <li><strong id="statPosts">12</strong> posts</li>
          <li><strong id="statFollowers">1.2K</strong> followers</li>
          <li><strong id="statFollowing">180</strong> following</li>
        </ul>

        <div class="profile__bio">
          <p class="profile__name" id="profileName">Your Name</p>
          <p id="profileBio">
            📷 Capturing moments<br />
            ✨ Placeholder bio — edit me in index.html<br />
            📍 Somewhere on Earth
          </p>
          <a class="profile__link" href="https://instagram.com/yourhandle"
             target="_blank" rel="noopener" id="profileLink">linktr.ee/yourhandle</a>
        </div>
      </div>
    </section>

    <!-- ===== Highlights ===== -->
    <section class="highlights" aria-label="Highlights">
      <div class="highlight"><div class="highlight__ring"><img src="https://picsum.photos/seed/hl1/120/120" alt="" /></div><span>Travel</span></div>
      <div class="highlight"><div class="highlight__ring"><img src="https://picsum.photos/seed/hl2/120/120" alt="" /></div><span>Food</span></div>
      <div class="highlight"><div class="highlight__ring"><img src="https://picsum.photos/seed/hl3/120/120" alt="" /></div><span>Friends</span></div>
      <div class="highlight"><div class="highlight__ring"><img src="https://picsum.photos/seed/hl4/120/120" alt="" /></div><span>Vibes</span></div>
    </section>

    <!-- ===== Tabs ===== -->
    <nav class="tabs" aria-label="Profile sections">
      <button class="tab is-active" data-tab="posts">POSTS</button>
      <button class="tab" data-tab="reels">REELS</button>
      <button class="tab" data-tab="tagged">TAGGED</button>
    </nav>

    <!-- ===== Post grid ===== -->
    <section class="grid" id="postGrid" aria-label="Posts">
      <!-- Posts are generated by script.js -->
    </section>
  </main>

  <!-- ===== Lightbox ===== -->
  <div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
    <button class="lightbox__close" id="lightboxClose" aria-label="Close">&times;</button>
    <div class="lightbox__content">
      <img class="lightbox__img" id="lightboxImg" src="" alt="" />
      <div class="lightbox__meta">
        <div class="lightbox__header">
          <img class="lightbox__avatar" src="https://picsum.photos/seed/instagramprofile/300/300" alt="" />
          <span id="lightboxUser">yourhandle</span>
        </div>
        <p class="lightbox__caption" id="lightboxCaption"></p>
        <div class="lightbox__actions">
          <button class="like-btn" id="lightboxLike" aria-label="Like">❤️</button>
          <span id="lightboxLikes">0 likes</span>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>&copy; <span id="year"></span> @yourhandle &middot; Built with HTML, CSS &amp; JS</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
